<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex, nofollow">
  <title>Cortes Zahir — Panel del Barbero</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda Zahir">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

  <!-- ══ LOGIN SCREEN ════════════════════════════════════════ -->
  <div id="loginScreen" class="login-screen" role="main">
    <div class="login-card">
      <div class="login-icon" aria-hidden="true">💈</div>
      <h1 class="login-title">Cortes Zahir</h1>
      <p class="login-subtitle">Panel del Barbero</p>

      <!-- PIN Dots -->
      <div class="pin-display" id="pinDisplay" role="status" aria-label="Ingresa tu PIN"></div>

      <!-- PIN Keyboard -->
      <div class="pin-keyboard" role="group" aria-label="Teclado numérico">
        <button class="pin-key" data-key="1" aria-label="1">1</button>
        <button class="pin-key" data-key="2" aria-label="2">2</button>
        <button class="pin-key" data-key="3" aria-label="3">3</button>
        <button class="pin-key" data-key="4" aria-label="4">4</button>
        <button class="pin-key" data-key="5" aria-label="5">5</button>
        <button class="pin-key" data-key="6" aria-label="6">6</button>
        <button class="pin-key" data-key="7" aria-label="7">7</button>
        <button class="pin-key" data-key="8" aria-label="8">8</button>
        <button class="pin-key" data-key="9" aria-label="9">9</button>
        <button class="pin-key pin-key--clear" data-key="clear" aria-label="Limpiar">CLR</button>
        <button class="pin-key" data-key="0" aria-label="0">0</button>
        <button class="pin-key pin-key--delete" data-key="del" aria-label="Borrar">⌫</button>
      </div>

      <p class="pin-error hidden" id="pinError" role="alert">PIN incorrecto. Intenta de nuevo.</p>
    </div>
  </div>

  <!-- ══ DASHBOARD ══════════════════════════════════════════ -->
  <div id="dashboard" class="dashboard hidden" role="main">

    <!-- Barra superior fija -->
    <header class="dash-top" id="dashTop">
      <div class="dash-header">
        <div class="dash-header__brand">
          <span class="dash-header__icon" aria-hidden="true">💈</span>
          <span>Agenda</span>
        </div>
        <div class="dash-header__actions">
          <button class="icon-btn" id="refreshBtn" aria-label="Actualizar">↻</button>
          <button class="icon-btn icon-btn--text" id="logoutBtn" aria-label="Cerrar sesión">Salir</button>
        </div>
      </div>

      <!-- Fecha -->
      <nav class="date-nav" aria-label="Navegación de fecha">
        <button class="date-nav__btn" id="prevDay" aria-label="Día anterior">‹</button>
        <label class="date-nav__center" id="navCenter">
          <span class="date-nav__date" id="navDate">—</span>
          <span class="date-nav__label" id="navLabel">Hoy</span>
          <input type="date" id="navDatePicker" class="date-nav__picker" aria-label="Elegir fecha">
        </label>
        <button class="date-nav__btn" id="nextDay" aria-label="Día siguiente">›</button>
      </nav>

      <!-- Semana -->
      <div class="week-strip" id="weekStrip" role="group" aria-label="Días de la semana"></div>
    </header>

    <!-- Demo Banner (sin Supabase) -->
    <div id="adminDemoBanner" class="demo-banner demo-banner--static hidden">
      ⚠️ Modo Demo — datos guardados solo en este dispositivo.
    </div>

    <!-- Resumen del día -->
    <section class="day-summary" aria-label="Resumen del día">
      <span class="chip"><b id="statTotal">0</b> turnos</span>
      <span class="chip chip--yellow"><b id="statPending">0</b> pendientes</span>
      <span class="chip chip--green"><b id="statCompleted">0</b> hechos</span>
      <button class="chip chip--gold invisible" id="goToday">Ir a hoy</button>
    </section>

    <!-- Agenda -->
    <section class="timeline" id="timeline" aria-label="Turnos del día" aria-live="polite">
      <div class="empty-state">
        <div class="spinner"></div>
        <div class="empty-state__title">Cargando agenda…</div>
      </div>
    </section>

    <!-- Barra de acciones inferior -->
    <nav class="bottom-bar" aria-label="Acciones">
      <button class="bottom-bar__btn" id="blockSlotBtn">
        <span aria-hidden="true">🔒</span> Bloquear
      </button>
      <button class="bottom-bar__btn bottom-bar__btn--primary" id="addApptBtn">
        <span aria-hidden="true">＋</span> Agregar turno
      </button>
    </nav>

  </div>

  <!-- ══ MODAL: Add Appointment ══════════════════════════════ -->
  <div class="admin-modal-overlay" id="addModal" role="dialog" aria-modal="true" aria-label="Agregar turno">
    <div class="admin-modal">
      <div class="admin-modal__handle"></div>
      <div class="admin-modal__title">
        <span>✂️</span>Agregar turno
      </div>

      <div class="form-group">
        <label for="addName">Nombre del cliente</label>
        <input type="text" id="addName" placeholder="Ej: Juan Pérez" autocomplete="off" maxlength="100">
      </div>
      <div class="form-group">
        <label for="addPhone">Teléfono (opcional)</label>
        <input type="tel" id="addPhone" placeholder="+56 9 1234 5678" autocomplete="off" maxlength="30">
      </div>
      <div class="form-group">
        <label for="addService">Servicio</label>
        <select id="addService"></select>
      </div>
      <div class="form-group">
        <label for="addDate">Fecha</label>
        <input type="date" id="addDate" class="admin-date-input">
      </div>
      <div class="form-group">
        <label for="addTime">Horario</label>
        <select id="addTime">
          <option value="">Selecciona primero la fecha</option>
        </select>
      </div>
      <div class="form-group">
        <label for="addNotes">Notas (opcional)</label>
        <textarea id="addNotes" rows="2" placeholder="Indicaciones especiales…" maxlength="500"></textarea>
      </div>

      <div class="admin-modal__actions">
        <button class="btn btn--ghost" id="addModalCancel">Cancelar</button>
        <button class="btn btn--primary" id="addModalConfirm">
          <span id="addBtnLabel">Guardar turno</span>
          <span id="addBtnSpinner" class="spinner hidden"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══ MODAL: Block Slot ═══════════════════════════════════ -->
  <div class="admin-modal-overlay" id="blockModal" role="dialog" aria-modal="true" aria-label="Bloquear horario">
    <div class="admin-modal">
      <div class="admin-modal__handle"></div>
      <div class="admin-modal__title">
        <span>🔒</span>Bloquear horario
      </div>

      <div class="form-group">
        <label for="blockDate">Fecha</label>
        <input type="date" id="blockDate" class="admin-date-input">
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="blockAllDay">
        <span>Bloquear el día completo</span>
      </label>
      <div id="blockRange">
        <div class="form-group">
          <label for="blockStart">Desde</label>
          <select id="blockStart"></select>
        </div>
        <div class="form-group">
          <label for="blockEnd">Hasta</label>
          <select id="blockEnd"></select>
        </div>
      </div>
      <div class="form-group">
        <label for="blockReason">Motivo (opcional)</label>
        <input type="text" id="blockReason" placeholder="Ej: Almuerzo, Vacaciones…" autocomplete="off" maxlength="100">
      </div>

      <div class="admin-modal__actions">
        <button class="btn btn--ghost" id="blockModalCancel">Cancelar</button>
        <button class="btn btn--primary" id="blockModalConfirm">
          <span id="blockBtnLabel">Bloquear</span>
          <span id="blockBtnSpinner" class="spinner hidden"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══ MODAL: Appointment Detail ═══════════════════════════ -->
  <div class="admin-modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-label="Detalle del turno">
    <div class="admin-modal">
      <div class="admin-modal__handle"></div>
      <div class="admin-modal__title" id="detailTitle">
        <span>📋</span>Detalle del turno
      </div>
      <div id="detailBody"></div>
      <div class="sheet-actions" id="detailActions"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
